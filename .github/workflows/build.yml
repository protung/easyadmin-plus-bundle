name: Build

on:
  push:
    branches: [ '*.x' ]
  pull_request:
    branches: [ '*.x' ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    strategy:
      fail-fast: false
      matrix:
        dependencies: [lowest, highest]
        php-versions:
          - 8.4
          - 8.5
        symfony:
          - 6.4.*
          - 7.4.*
          - 8.*
        easyadmin:
          - 4.*
          - 5.*
    name: PHP ${{ matrix.php-versions }}, Symfony ${{ matrix.symfony }} and EasyAdmin ${{ matrix.easyadmin }} checks with ${{ matrix.dependencies }} dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: flex

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ matrix.php-versions }}-symfony-${{ matrix.symfony }}-easyadmin-${{ matrix.easyadmin }}-composer-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: "php-${{ matrix.php-versions }}-symfony-${{ matrix.symfony }}-easyadmin-${{ matrix.easyadmin }}-composer-${{ matrix.dependencies }}-"

      - name: Install lowest dependencies
        if: ${{ matrix.dependencies == 'lowest' }}
        run: composer update --prefer-lowest --prefer-dist --no-progress --no-interaction --with "easycorp/easyadmin-bundle:${{ matrix.easyadmin }}"

      - name: Install highest dependencies
        if: ${{ matrix.dependencies == 'highest' }}
        run: composer update --prefer-dist --no-progress --no-interaction --with "easycorp/easyadmin-bundle:${{ matrix.easyadmin }}"

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Run checks
        run: just check

  assets:
    runs-on: ubuntu-latest
    name: Built assets are up to date
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install node modules
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Check that the committed assets match the build
        run: |
          git status --short -- public
          test -z "$(git status --porcelain -- public)"
