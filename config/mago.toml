# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.4.0"

[source]
paths = ["src/", "tests/"]
includes = ["vendor"]

[formatter]
print-width = 120
tab-width = 4
use-tabs = false

[linter]
integrations = ["psl", "symfony", "phpunit"]

[linter.rules]
literal-named-argument = { enabled = false }
halstead = { volume-threshold = 3_200, effort-threshold = 24_000, difficulty-threshold = 32 }
kan-defect = { enabled = false }
cyclomatic-complexity = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
excessive-parameter-list = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
no-else-clause = { enabled = false }
prefer-early-continue = { enabled = false }
class-name = { enabled = false }
interface-name = { enabled = false }
trait-name = { enabled = false }
yoda-conditions = { enabled = false }
assertion-style = { style = "self" }
psl-datetime = { enabled = false }
# BaseCrudDtoController copies EasyAdmin's edit() and new(), which silence a deprecation and use PHP's string functions
no-error-control-operator = { exclude = ["src/Controller/BaseCrudDtoController.php"] }
psl-string-functions = { exclude = ["src/Controller/BaseCrudDtoController.php"] }

[analyzer]
plugins = ["psl"]
find-unused-definitions = true
analyze-dead-code = true
check-throws = true
allow-possibly-undefined-array-keys = true
perform-heuristic-checks = true

# Ignore a specific error code across the whole project
ignore = [
    "unhandled-thrown-type", # 242 errors
    # Symfony 6.4 names the parameters of AbstractBundle::loadExtension() $container and $builder, 7.4 and later $configurator and $container
    { code = "incompatible-parameter-name", in = ["src/ProtungEasyAdminPlusBundle.php"] }, # 2 errors on Symfony 6.4
    # Symfony 6.4 types the return of getSubscribedServices() as array<string>, so every class inheriting it from the FlashMessages trait is reported
    { code = "incompatible-return-type", in = ["tests/Controller/BaseCrudControllerTest.php", "tests/Test/TestApplication/Controller/EmptyFormNoteCrudController.php", "tests/Test/TestApplication/Controller/NoteCrudController.php", "tests/Test/TestApplication/Controller/SaveForbiddenNoteCrudController.php", "tests/Test/TestApplication/Controller/SwitchNoteCrudController.php"] }, # 5 errors on Symfony 6.4
    # Symfony 6.4 types the return of Crawler::each() as array, 7.4 and later as list<R>
    { code = "invalid-return-statement", in = ["src/Test/Controller/DashboardControllerTestCase.php"] }, # 2 errors on Symfony 6.4
    # askConfirmation() only takes a closure since EasyAdmin 5.10, so its closures are reported before
    { code = "invalid-argument", in = ["tests/Test/TestApplication/Controller/ConfirmationModalCrudController.php"] }, # 2 errors before EasyAdmin 5.10
    # AdminRouteGenerator::usesPrettyUrls() only exists in EasyAdmin 4, EasyAdmin 5 always uses pretty URLs
    { code = "non-existent-method", in = ["src/Field/Configurator/EntityConfigurator.php"] }, # 1 error on EasyAdmin 5
    # CrudPermissionCheckerInterface only exists since EasyAdmin 5.9, EntityConfigurator links every target before
    { code = "non-existent-class-like", in = ["src/Field/Configurator/EntityConfigurator.php"] }, # 1 error before EasyAdmin 5.9
    { code = "invalid-method-access", in = ["src/Field/Configurator/EntityConfigurator.php"] }, # 1 error before EasyAdmin 5.9
    # FieldFactory::getFieldsOfDeniedLayoutContainers() only exists since EasyAdmin 4.29.18 and 5.10.4, EntityPaginator doesn't need it before
    { pattern = "getFieldsOfDeniedLayoutContainers", code = "non-existent-method", in = ["src/Orm/EntityPaginator.php"] }, # 1 error on EasyAdmin 5 before 5.10.4
    # BaseCrudDtoController copies EasyAdmin's edit(), new() and isAnySaveActionGranted(), which don't check for null
    { code = "possible-method-access-on-null", in = ["src/Controller/BaseCrudDtoController.php"] }, # 8 errors
    { code = "possibly-null-operand", in = ["src/Controller/BaseCrudDtoController.php"] }, # 2 errors
    # BaseCrudDtoController copies EasyAdmin's new(), which narrows the type of $entityFqcn
    { pattern = "entityFqcn", code = "redundant-docblock-type", in = ["src/Controller/BaseCrudDtoController.php"] }, # 1 error
    # Symfony 6.4 types the query parameters that EasyAdmin's edit() reads as bool|float|int|string|null, 7.4 and later as string|null
    { code = "invalid-operand", in = ["src/Controller/BaseCrudDtoController.php"] }, # 1 error on Symfony 6.4
    { pattern = "isCsrfTokenValid", code = "possibly-invalid-argument", in = ["src/Controller/BaseCrudDtoController.php"] }, # 2 errors on Symfony 6.4
    # ActionConfigDto::getSaveActionNames() only exists since EasyAdmin 5.10.3, isAnySaveActionGranted() checks nothing before
    { pattern = "getSaveActionNames", code = "non-existent-method", in = ["src/Controller/BaseCrudDtoController.php"] }, # 1 error before EasyAdmin 5.10.3
    { code = "invalid-iterator", in = ["src/Controller/BaseCrudDtoController.php"] }, # 1 error before EasyAdmin 5.10.3
    { code = "mixed-assignment", in = ["src/Controller/BaseCrudDtoController.php"] }, # 2 errors before EasyAdmin 5.10.3
]
