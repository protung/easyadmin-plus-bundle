# Welcome to Mago!
# For full documentation, see https://mago.carthage.software/tools/overview
php-version = "8.4.0"

[source]
paths = ["src/", "tests/"]
includes = ["vendor"]

[formatter]
print-width = 120
tab-width = 4
use-tabs = false

[linter]
integrations = ["psl", "symfony", "phpunit"]

[linter.rules]
literal-named-argument = { enabled = false }
halstead = { volume-threshold = 3_200, effort-threshold = 24_000, difficulty-threshold = 32 }
kan-defect = { enabled = false }
cyclomatic-complexity = { enabled = false }
too-many-methods = { enabled = false }
too-many-properties = { enabled = false }
excessive-parameter-list = { enabled = false }
no-boolean-flag-parameter = { enabled = false }
no-else-clause = { enabled = false }
prefer-early-continue = { enabled = false }
class-name = { enabled = false }
interface-name = { enabled = false }
trait-name = { enabled = false }
yoda-conditions = { enabled = false }
assertion-style = { style = "self" }
psl-datetime = { enabled = false }

[analyzer]
plugins = ["psl"]
find-unused-definitions = true
analyze-dead-code = true
check-throws = true
allow-possibly-undefined-array-keys = true
perform-heuristic-checks = true

# Ignore a specific error code across the whole project
ignore = [
    "unhandled-thrown-type", # 242 errors
    # Symfony 6.4 names the parameters of AbstractBundle::loadExtension() $container and $builder, 7.4 and later $configurator and $container
    { code = "incompatible-parameter-name", in = ["src/ProtungEasyAdminPlusBundle.php"] }, # 2 errors on Symfony 6.4
    # Symfony 6.4 types the return of getSubscribedServices() as array<string>, so every class inheriting it from the FlashMessages trait is reported
    { code = "incompatible-return-type", in = ["tests/Controller/BaseCrudControllerTest.php"] }, # 1 error on Symfony 6.4
    # Symfony 6.4 types the return of Crawler::each() as array, 7.4 and later as list<R>
    { code = "invalid-return-statement", in = ["src/Test/Controller/DashboardControllerTestCase.php"] }, # 2 errors on Symfony 6.4
]
